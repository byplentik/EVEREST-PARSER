services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-everest_parser}
      POSTGRES_USER: ${POSTGRES_USER:-everest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-everest}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-everest} -d ${POSTGRES_DB:-everest_parser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    command: ["everest-parser", "about"]

volumes:
  postgres_data:

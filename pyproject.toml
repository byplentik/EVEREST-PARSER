[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "everest-parser"
version = "0.1.0"
description = "Batch parser scaffold for Fedresurs and KAD."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2.2,<3",
    "SQLAlchemy>=2.0,<3",
    "undetected-chromedriver==3.5.5",
]

[project.scripts]
everest-parser = "everest_parser.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

